name: Update stats

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start the deploy (ci.yml) after a commit

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: node scripts/fetch-stats.mjs
      - run: node scripts/fetch-playlists.mjs
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet src/data/stats.json src/data/playlists.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/stats.json src/data/playlists.json
          git commit -m "Update stats"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # A push made with GITHUB_TOKEN starts no workflow, so CI is started by
      # hand: it checks the new numbers and deploys them.
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main

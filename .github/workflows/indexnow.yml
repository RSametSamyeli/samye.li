name: IndexNow

# Tells IndexNow search engines (Bing, and through it ChatGPT search and
# Copilot; Yandex, Naver, Seznam) which pages exist, after each deploy, so new
# and changed pages are crawled in minutes instead of weeks. The key is public
# by design: the engines check it at https://samye.li/<key>.txt.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: true

env:
  SITE: https://samye.li
  KEY: 1d2215ef99afb2d26b93e99d7856a10c

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for the deploy
        # Coolify builds on the same push; the key file answers once it is live.
        run: |
          sleep 120
          for i in $(seq 1 30); do
            if curl -fsS "$SITE/$KEY.txt" | grep -qx "$KEY"; then exit 0; fi
            sleep 20
          done
          echo "::warning::$SITE/$KEY.txt is not reachable; nothing submitted"
          exit 1
      - name: Submit the sitemap's pages
        run: |
          urls=$(curl -fsS "$SITE/sitemap-0.xml" | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g' | jq -R . | jq -sc .)
          echo "Submitting $(echo "$urls" | jq length) URLs"
          jq -n --arg host samye.li --arg key "$KEY" --arg loc "$SITE/$KEY.txt" --argjson urls "$urls"             '{host: $host, key: $key, keyLocation: $loc, urlList: $urls}'             | curl -fsS -X POST https://api.indexnow.org/indexnow                 -H 'Content-Type: application/json; charset=utf-8' --data-binary @- -o /dev/null -w 'IndexNow: HTTP %{http_code}\n'

# Which HTML paths have a plain-markdown mirror. Mirrors the rule in
# src/utils/ai.ts (markdownMirrorPath); keep the two in sync.
#   /            -> /index.md
#   /lodos/      -> /lodos.md
#   /blog/x/     -> /blog/x.md
map $uri $md_mirror {
  default                                   "";
  "~^/$"                                    /index.md;
  "~^/(?<p>(lodos|projects|blog|shorts))/?$" /$p.md;
  "~^/(?<p>(blog|shorts)/[^/.]+)/?$"        /$p.md;
}

# An agent that explicitly asks for markdown gets the mirror at the page URL.
# Browsers send */* or text/html, so they always get HTML.
map $http_accept $wants_markdown {
  default             0;
  "~*text/markdown"   1;
}

map "$wants_markdown:$md_mirror" $md_rewrite {
  default     "";
  "~^1:(?<m>/.+)$" $m;
}

map $md_mirror $md_link {
  default "";
  "~.+"   "<$md_mirror>; rel=\"alternate\"; type=\"text/markdown\"";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Relative redirects (e.g. /branding/muvi -> /branding/muvi/) so the host and https survive the proxy.
  absolute_redirect off;
  charset utf-8;
  charset_types text/plain text/markdown text/xml application/xml application/json;

  location / {
    if ($md_rewrite) {
      rewrite ^ $md_rewrite last;
    }
    add_header Link $md_link;
    add_header Vary Accept;
    try_files $uri $uri/ $uri.html =404;
  }

  location ~ \.md$ {
    types { }
    default_type text/markdown;
    add_header Vary Accept;
    try_files $uri =404;
  }

  location = /llms.txt      { default_type text/plain; }
  location = /llms-full.txt { default_type text/plain; }

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  error_page 404 /404.html;
}

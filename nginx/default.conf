# samye.li: the static Astro build (dist/), served behind Cloudflare.

# Which HTML paths have a plain-markdown mirror. Mirrors the rule in
# src/utils/ai.ts (markdownMirrorPath); keep the two in sync.
#   /            -> /index.md
#   /lodos/      -> /lodos.md
#   /blog/x/     -> /blog/x.md
#   /tr/         -> /tr/index.md
#   /tr/lodos/   -> /tr/lodos.md
map $uri $md_mirror {
  default                                   "";
  "~^/$"                                    /index.md;
  "~^/(?<p>(lodos|projects|now|uses|beliefs|colophon|security-by-construction|community|blog|shorts))/?$" /$p.md;
  "~^/(?<p>(blog|shorts)/[^/.]+)/?$"        /$p.md;
  "~^/tr/?$"                                /tr/index.md;
  "~^/tr/(?<p>(lodos|projects|now|uses|beliefs|colophon|security-by-construction|community|blog))/?$" /tr/$p.md;
}

# An agent that explicitly asks for markdown gets the mirror at the page URL.
# Browsers send */* or text/html, so they always get HTML.
map $http_accept $wants_markdown {
  default             0;
  "~*text/markdown"   1;
}

map "$wants_markdown:$md_mirror" $md_rewrite {
  default     "";
  "~^1:(?<m>/.+)$" $m;
}

map $md_mirror $md_link {
  default "";
  "~.+"   "<$md_mirror>; rel=\"alternate\"; type=\"text/markdown\"";
}

# How long browsers and Cloudflare may keep a response. Hashed build assets
# never change; pages, feeds and the markdown mirrors change with every deploy,
# so they are revalidated; generated images and icons keep for a day.
map $uri $cache_control {
  default                                       "public, max-age=0, must-revalidate";
  "~^/_astro/"                                  "public, max-age=31536000, immutable";
  "~^/(og-images|pagefind)/"                    "public, max-age=86400";
  "~^/(favicon\.(svg|ico)|apple-touch-icon\.png|icon-[a-z0-9]+\.png)$" "public, max-age=86400";
}

# Pages kept out of search results: client work under /branding/ is shared by
# link, not published.
map $uri $robots_tag {
  default        "";
  "~^/branding/" "noindex, nofollow";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Relative redirects (e.g. /branding/muvi -> /branding/muvi/) so the host and https survive the proxy.
  absolute_redirect off;
  charset utf-8;
  charset_types text/plain text/markdown text/xml application/xml application/json application/manifest+json;

  # Compress for the hop to Cloudflare (which recompresses for visitors).
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/markdown text/css text/xml application/xml application/rss+xml
             application/javascript application/json application/manifest+json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control $cache_control always;
  add_header X-Robots-Tag $robots_tag always;

  location / {
    if ($md_rewrite) {
      rewrite ^ $md_rewrite last;
    }
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control $cache_control always;
    add_header X-Robots-Tag $robots_tag always;
    add_header Link $md_link;
    add_header Vary Accept;
    try_files $uri $uri/ $uri.html =404;
  }

  location ~ \.md$ {
    types { }
    default_type text/markdown;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control $cache_control always;
    add_header Vary Accept;
    try_files $uri =404;
  }

  location = /llms.txt      { default_type text/plain; }
  location = /llms-full.txt { default_type text/plain; }

  error_page 404 /404.html;
}

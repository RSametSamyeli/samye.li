# Response headers for every page and file. nginx drops a server's add_header
# lines in any location that has add_header of its own, so default.conf
# includes this file in the server block and again in each such location.
#
# HSTS is set at the edge by Cloudflare (SSL/TLS > Edge Certificates), not here.

# What a page may load. Scripts and styles stay on this origin; inline ones are
# allowed because Astro inlines small scripts (the theme, before first paint)
# and the client router swaps pages in place (re-running them through an empty
# data: script, so data: is allowed for scripts too). 'wasm-unsafe-eval' is Pagefind's
# search index. Images may come from any https origin (project and link icons);
# Cloudflare's own analytics beacon is allowed if it is ever turned on.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' data: https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
